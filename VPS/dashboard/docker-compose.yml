services:
  dashboard:
    build: .
    image: catfinder-dashboard:latest
    container_name: catfinder-dashboard
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # Persistente Analyse-Daten (SQLite + Modell-Parameter) — überleben
      # Container-Neubauten und liegen NICHT in GitHub.
      - /opt/catfinder/data:/data
    environment:
      # Karten kommen jetzt vom Manager (/mapsync, siehe MapConcept.md), kein
      # MAP_URL/GitHub-Fetch mehr. GITHUB_MAP_TOKEN optional setzen, um
      # angenommene Karten automatisch nach Controller/Manager6_3_0/data/<typ>.csv
      # (Source of Truth) + Map/backup/<typ>.csv zu committen (Deploy-Token,
      # Contents: Read&Write NUR auf dieses Repo - siehe KartenUpload.md
      # "GITHUB_MAP_TOKEN einrichten" und dashboard.py _github_commit_map).
      # Wert kommt aus .env (siehe .env.example daneben) - NIE hier direkt
      # eintragen, sonst landet der Token im Git-Verlauf.
      GITHUB_MAP_TOKEN: "${GITHUB_MAP_TOKEN:-}"
      DB_PATH: "/data/catfinder.db"
      PARAMS_PATH: "/data/model_params.json"
      # Die Weboberflaeche liegt unter diesem Pfad, der Wurzelpfad liefert 404.
      # Nur Verschleierung gegen Scanner, KEINE Authentifizierung - wer den Pfad
      # kennt, kann weiterhin alles (auch /command). Die sieben Endpunkte der
      # Firmware bleiben zwingend am Wurzelpfad, siehe DEVICE_ROUTES in
      # dashboard.py. Leerer Wert = altes Verhalten (alles am Wurzelpfad).
      UI_PREFIX: "${UI_PREFIX:-/Tristan}"
